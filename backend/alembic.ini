# Alembic 配置。说明见 docs/DEPLOYMENT.md §3.7。
#
# 数据库连接串不写在这里 —— 它来自环境变量 DATABASE_URL（见 alembic/env.py），
# 因为连接串含密码，绝不能进仓库。

[alembic]
script_location = alembic

# 迁移文件名带时间戳前缀，保证按时间排序
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 迁移文件里不写入时区相关的元数据，避免不同机器产生无意义 diff
timezone = UTC

prepend_sys_path = .

# 版本目录（相对于 script_location）
version_path_separator = os


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
