<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Crosslayer 录制演播页</title>
<style>
  /* 演播页 = 录制时的"摄影棚"：一个真实终端 + 一个真实应用界面，同一页里切换。
   *
   * ## 为什么终端和应用必须在同一页
   *
   * 如果录终端时用一张页面、录界面时导航到应用 URL，**终端的内容会丢**——
   * 它保存在客户端 JS 状态里，导航即销毁。结果是每次回到终端都要重新建会话，
   * 画面上表现为"终端被清空了"，看起来像换了台机器。
   *
   * 所以：一张页面，两个视图，切换只改 CSS class。终端状态全程不丢。
   * 应用界面用 iframe 嵌（跨源只设 src、不读 DOM —— 录制只需要它显示出来）。 */
  :root {
    --bg: #0b1017;
    --bar: #131c26;
    --fg: #d7e3ec;
    --dim: #6b7d8d;
    --accent: #0e7c86;
    --accent-bright: #3fb6c0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1920px; height: 1080px;
    background: var(--bg); overflow: hidden;
    font-family: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
  }
  #stage { position: relative; width: 1920px; height: 1080px; }

  .view { position: absolute; inset: 0; display: flex; flex-direction: column; }
  body.mode-term .view--app { display: none; }
  body.mode-app .view--term { display: none; }

  /* ---------------- 终端视图 ---------------- */
  .titlebar {
    height: 44px; flex: 0 0 44px; background: var(--bar);
    display: flex; align-items: center; gap: 12px; padding: 0 18px;
    border-bottom: 1px solid #1e2b38; font-size: 18px; color: var(--dim);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot--a { background: #c0392b; } .dot--b { background: #c97b1e; } .dot--c { background: #2f855a; }
  .titlebar__name { color: var(--fg); margin-left: 6px; }
  .titlebar__hint { margin-left: auto; font-size: 16px; }
  .panes { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .pane { flex: 1 1 50%; display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid #1e2b38; }
  .pane:last-child { border-bottom: none; }
  .pane--solo { flex: 1 1 100%; }
  .pane__head {
    flex: 0 0 34px; background: #101822; color: var(--dim); font-size: 16px;
    display: flex; align-items: center; gap: 10px; padding: 0 18px;
    border-bottom: 1px solid #1a2531;
  }
  .pane__badge {
    background: #17222e; color: var(--accent-bright); border: 1px solid #22303e;
    border-radius: 6px; padding: 2px 10px; font-size: 15px;
  }
  .pane__body { flex: 1 1 auto; overflow: hidden; padding: 14px 18px; }
  pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font: 500 19px/1.42 "Cascadia Mono", Consolas, ui-monospace, monospace; color: var(--fg);
  }
  .caret { display: inline-block; width: 11px; height: 21px; background: var(--accent-bright);
           vertical-align: -3px; animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

  .c-teal { color: var(--accent-bright); } .c-red { color: #e06c5a; }
  .c-green { color: #6fcf97; } .c-yellow { color: #e2b93b; }
  .c-blue { color: #6ba8e5; } .c-dim { color: var(--dim); } .b { font-weight: 700; }

  /* ---------------- 应用视图 ---------------- */
  .appbar {
    height: 44px; flex: 0 0 44px; background: var(--bar);
    display: flex; align-items: center; gap: 14px; padding: 0 20px;
    border-bottom: 1px solid #1e2b38; font-size: 18px; color: var(--dim);
  }
  .appbar__url {
    flex: 1 1 auto; background: #0e1620; border: 1px solid #1e2b38; border-radius: 8px;
    padding: 6px 14px; color: var(--fg); font-size: 17px;
  }
  .appbar__tab { color: var(--accent-bright); }
  iframe { flex: 1 1 auto; width: 1920px; border: 0; background: #0f1720; }
</style>
</head>
<body class="mode-term">
<div id="stage">
  <!-- ============ 终端视图 ============ -->
  <div class="view view--term">
    <div class="titlebar">
      <span class="dot dot--a"></span><span class="dot dot--b"></span><span class="dot dot--c"></span>
      <span class="titlebar__name" id="winTitle">Crosslayer 演示 · 录制终端</span>
      <span class="titlebar__hint">WSL · Ubuntu · 1920×1080</span>
    </div>
    <div class="panes" id="panes"></div>
  </div>

  <!-- ============ 应用视图 ============ -->
  <div class="view view--app">
    <div class="appbar">
      <span class="appbar__tab" id="appTab">Crosslayer 控制台</span>
      <span class="appbar__url" id="appUrl">http://localhost:5173/</span>
    </div>
    <iframe id="appFrame" src="about:blank"></iframe>
  </div>
</div>

<script>
/* ============================================================================
 * 录制演播页
 *
 * 终端视图里每一行都来自 WSL 里一个**真正的 bash 伪终端**（见 pty_server.py）。
 * 应用视图是一个 iframe，加载**真实运行的前端**（Vite dev server :5173，
 * 数据来自真实后端 :8080）。整页由 Chrome 的 CDP screencast 录制。
 * ========================================================================== */

const POLL_MS = 120;
const panes = new Map();

const SGR = {
  0: null, 1: "b", 22: null,
  30: "c-dim", 31: "c-red", 32: "c-green", 33: "c-yellow", 34: "c-blue", 36: "c-teal", 37: null,
  90: "c-dim", 91: "c-red", 92: "c-green", 93: "c-yellow", 94: "c-blue", 96: "c-teal", 97: null,
  38: "c-teal", 39: null,
};

function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function span(t, cls) { return !t ? "" : (cls.length ? `<span class="${cls.join(" ")}">${t}</span>` : t); }

/** 极简 SGR 渲染。
 *
 * ⚠️ 解析必须按**完整的 CSI 序列**切，不能只找以 `m` 结尾的。
 * 第一版就是只找 `m`，结果 bash 发的 `ESC[?2004h`（括号粘贴模式开关，
 * 以 `h` 结尾）被当成"还没结束"，解析器一路吞到后面某个 `m` 为止 ——
 * 症状是提示符附近**凭空少掉一段字**，而且看起来像终端本身的问题。
 *
 * 现在：任何 `ESC[<参数><字母>` 都算一个序列；只有 `m`（SGR）产生样式，
 * 其余（光标、擦除、模式切换）一律忽略。刻意不实现它们 ——
 * 我们的命令不产生全屏 TUI 输出，假装支持却做错比明确不支持更糟。 */
function render(text) {
  text = text.replace(/\r\n/g, "\n").replace(/\r/g, "");

  let html = "";
  let cls = [];
  let last = 0;
  const CSI = /\u001b\[([0-9;?]*)([A-Za-z])/g;
  let m;
  while ((m = CSI.exec(text)) !== null) {
    html += span(esc(text.slice(last, m.index)), cls);
    if (m[2] === "m") {
      for (const code of m[1].split(";").map((n) => parseInt(n, 10))) {
        const mapped = SGR[code];
        if (code === 0 || mapped === null || Number.isNaN(code)) cls = [];
        else if (typeof mapped === "string" && !cls.includes(mapped)) cls.push(mapped);
      }
    }
    last = m.index + m[0].length;
  }
  html += span(esc(text.slice(last)), cls);
  return html;
}

async function api(path, body) {
  const res = await fetch(path, body
    ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }
    : undefined);
  return res.json();
}

/* ---------------------------------------------------------------- 渲染脚本接口 */

window.__addPane = async (id, title, badge, solo = false) => {
  const box = document.createElement("div");
  box.className = "pane" + (solo ? " pane--solo" : "");
  box.innerHTML = `
    <div class="pane__head">
      ${badge ? `<span class="pane__badge">${badge}</span>` : ""}<span>${title}</span>
    </div>
    <div class="pane__body"><pre id="pre-${id}"></pre></div>`;
  document.getElementById("panes").appendChild(box);

  const pre = document.getElementById(`pre-${id}`);
  panes.set(id, { pre, raw: "", offset: 0 });
  await api("/api/session", { name: id });

  setInterval(async () => {
    const s = panes.get(id);
    try {
      const r = await api(`/api/out?id=${id}&from=${s.offset}`);
      if (!r.data) return;
      s.offset = r.next;
      s.raw += r.data;
      // 只留最后 ~200 行：DOM 无限增长会拖慢截图，进而拖垮录制帧率。
      const lines = s.raw.split("\n");
      if (lines.length > 220) s.raw = lines.slice(-200).join("\n");
      s.pre.innerHTML = render(s.raw) + '<span class="caret"></span>';
    } catch (e) { /* 一次轮询失败不该中断录制 */ }
  }, POLL_MS);
};

/** 移除某个窗格（例如从双窗格切成单窗格）。 */
window.__removePane = (id) => {
  const s = panes.get(id);
  if (!s) return;
  s.pre.closest(".pane").remove();
  panes.delete(id);
};

window.__exec = (id, cmd, typingDelay = 0.03) => api("/api/exec", { id, cmd, typingDelay });
window.__send = (id, text) => api("/api/send", { id, text });
window.__interrupt = (id) => api("/api/interrupt", { id });
window.__clear = (id) => { const s = panes.get(id); if (s) { s.raw = ""; s.pre.innerHTML = ""; } };

window.__waitFor = async (id, needle, timeoutMs = 45000) => {
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    const s = panes.get(id);
    if (s && s.raw.includes(needle)) return true;
    await new Promise((r) => setTimeout(r, 100));
  }
  return false;
};

/** 切到应用视图并加载某个路由。跨源只设 src，不读 DOM。 */
window.__showApp = async (route, tabLabel) => {
  document.getElementById("appFrame").src = `http://localhost:5173${route}`;
  document.getElementById("appUrl").textContent = `http://localhost:5173${route}`;
  if (tabLabel) document.getElementById("appTab").textContent = tabLabel;
  document.body.className = "mode-app";
};

window.__showTerm = () => { document.body.className = "mode-term"; };
</script>
</body>
</html>
